services:
  api:
    image: agents-api:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        CATEDRALX_BASE_IMAGE: catedralx:candidate-ec3d83d2626b
    container_name: agents-api
    ports:
      - "127.0.0.1:8228:8766"
      - "127.0.0.1:8766:8766"
    volumes:
      - agents_runtime_state:/home/chalamandra/.local/state/chalamandra
    env_file:
      - config/.env
    environment:
      CATEDRALX_PATH: /app/CatedralX
      PYTHONPATH: /app
      CHALAMANDRA_API_MAX_CONCURRENCY: "64"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8766/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks: [agents_net]

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
      args:
        AGENTS_BASE_IMAGE: agents-api:latest
    container_name: agents-worker
    env_file:
      - config/.env
    environment:
      CATEDRALX_PATH: /app/CatedralX
      PYTHONPATH: /app
      # Keep one worker until per-process health telemetry and measured load tests justify scaling out.
      CHALAMANDRA_WORKER_PROCESSES: "1"
      CHALAMANDRA_WORKER_POLL_INTERVAL: "0.2"
    volumes:
      - agents_runtime_state:/home/chalamandra/.local/state/chalamandra
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 70s
    restart: unless-stopped
    networks: [agents_net]

volumes:
  agents_runtime_state:
    external: true
    name: agents_agents_runtime_state

networks:
  agents_net:
    driver: bridge
