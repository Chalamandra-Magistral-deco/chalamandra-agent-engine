services:
  api:
    image: ${AGENTS_API_IMAGE:-agents-api:candidate-v4.2}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        CATEDRALX_BASE_IMAGE: ${CATEDRALX_BASE_IMAGE:-catedralx:v4.2}
        AGENTS_REVISION: ${AGENTS_REVISION:-unknown}
        AGENTS_CODE_DIRTY: ${AGENTS_CODE_DIRTY:-unknown}
        CATEDRALX_REVISION: ${CATEDRALX_REVISION:-unknown}
        CATEDRALX_CODE_DIRTY: ${CATEDRALX_CODE_DIRTY:-unknown}
    container_name: agents-api
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - agents_runtime_state:/home/chalamandra/.local/state/chalamandra
      - catedralx_runtime_state:/home/chalamandra/.local/state/chalamandra/catedralx
    env_file:
      - config/.env
    environment:
      CATEDRALX_PATH: /app/CatedralX
      PYTHONPATH: /app
      CHALAMANDRA_API_MAX_CONCURRENCY: "64"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8766/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks: [agents_net]

  worker:
    image: ${AGENTS_WORKER_IMAGE:-agents-worker:candidate-v4.2}
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
      args:
        AGENTS_BASE_IMAGE: ${AGENTS_API_IMAGE:-agents-api:candidate-v4.2}
    container_name: agents-worker
    env_file:
      - config/worker.env
    environment:
      CATEDRALX_PATH: /app/CatedralX
      PYTHONPATH: /app
      # Keep one worker until per-process health telemetry and measured load tests justify scaling out.
      CHALAMANDRA_WORKER_PROCESSES: "1"
      CHALAMANDRA_WORKER_POLL_INTERVAL: "0.2"
    volumes:
      - agents_runtime_state:/home/chalamandra/.local/state/chalamandra
      - catedralx_runtime_state:/home/chalamandra/.local/state/chalamandra/catedralx
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 70s
    restart: unless-stopped
    networks: [agents_net]

volumes:
  agents_runtime_state:
    name: agents_agents_runtime_state
  catedralx_runtime_state:
    name: agents_catedralx_runtime_state

networks:
  agents_net:
    driver: bridge
