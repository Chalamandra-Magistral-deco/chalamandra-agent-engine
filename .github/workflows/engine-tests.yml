name: Engine unit tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout canonical CatedralX source for tests
        uses: actions/checkout@v4
        with:
          repository: Chalamandra-Magistral-deco/CatedralX
          ref: bcb13f92312c21ebdb9f407e1d936f86d0d42e5d
          path: CatedralX
          token: ${{ secrets.CATEDRALX_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        env:
          CATEDRALX_PATH: ${{ github.workspace }}/CatedralX
        run: python -m pytest -q --ignore=CatedralX

      - name: Lint
        run: python -m ruff check api adapters core dynamics pipeline registry security telemetry tests

      - name: Type check
        run: python -m mypy api adapters core dynamics pipeline registry security telemetry
