name: Engine unit tests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout canonical CatedralX source for tests
        uses: actions/checkout@v4
        with:
          repository: Chalamandra-Magistral-deco/CatedralX
          ref: c1a3d0334b9193417e5f614b68bb51011fdd887f
          path: CatedralX
          token: ${{ secrets.CATEDRALX_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        env:
          CATEDRALX_PATH: ${{ github.workspace }}/CatedralX
        run: python -m pytest -q --ignore=CatedralX

      - name: Lint
        run: python -m ruff check api adapters core dynamics pipeline registry security telemetry tests

      - name: Type check
        run: python -m mypy api adapters core dynamics pipeline registry security telemetry
