name: Chalamandra Release Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-agents:
    name: "Agents Tests (145) + Fail-Closed Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install -e . || true
          pip install pytest PyJWT httpx pydantic

      - name: Run Agents Tests & Architectural Validation
        env:
          CHALAMANDRA_JWT_SECRET: "test-secret-min-32-bytes-long-for-ci-xxxxxx"
          CHALAMANDRA_API_ENABLE_MODEL_CALLS: "true"
        run: |
          python -m pytest -q --junitxml=junit-agents.xml
          
          echo "=== VALIDACIÓN ARQUITECTÓNICA: Fail-Closed ==="
          PYTHONPATH=. python -c "
          from pipeline.catedralx_tool import catedralx_reasoning_tool
          r = catedralx_reasoning_tool(historical_prices=[80000]*4, current_price=80000, asset='BTCUSDT')
          assert r.get('trading_eligible') == False, 'CRÍTICO: Debe bloquear con <30 precios'
          assert r.get('orders_created') == False, 'CRÍTICO: El agente no puede crear órdenes'
          print('✅ Fail-closed validado: <30 precios bloqueado correctamente')
          "

  build-docker:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: [test-agents]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Agents API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chalamandra-agents:latest
            ghcr.io/${{ github.repository_owner }}/chalamandra-agents:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
