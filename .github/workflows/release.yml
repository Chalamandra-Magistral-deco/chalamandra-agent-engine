name: Chalamandra Agents - 435 Tests + Docker
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
jobs:
  test-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: |
          pip install -r requirements.txt
          pip install -r requirements.txt
          pip install pytest pytest-asyncio PyJWT httpx ruff mypy openai google-generativeai ollama
      - env:
          CHALAMANDRA_JWT_SECRET: test-secret-min-32-bytes-long-for-ci-xxxx
          CHALAMANDRA_API_TOKEN: test-api-token-for-ci-32-bytes-long-xxxx
          CHALAMANDRA_API_ENABLE_MODEL_CALLS: "true"
        run: |
          ruff check .
          mypy api/ --ignore-missing-imports
          pytest -q
  docker:
    needs: test-agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - # uses: docker/setup-buildx-action@v3
      - run: docker build -f deploy/Dockerfile -t chalamandra-agents:${{ github.sha }} .
