name: Chalamandra Agents - 435 Tests + Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest PyJWT httpx
      - name: Tests 145 + TaskBus + 202 + 409
        env:
          CHALAMANDRA_JWT_SECRET: test-secret-min-32-bytes-long-for-ci-xxxx
          CHALAMANDRA_API_ENABLE_MODEL_CALLS: "true"
        run: |
          python -m pytest -q
          python -c "
          from api.task_bus import TaskBus
          bus = TaskBus()
          id1 = bus.enqueue_task({'objective':'test','payload':{'a':1}}, 'ci-key-1')
          id2 = bus.enqueue_task({'objective':'test','payload':{'a':1}}, 'ci-key-1')
          assert id1==id2, 'idempotencia falló'
          print(f'✅ Idempotencia OK {id1}')
          try:
              bus.enqueue_task({'objective':'test','payload':{'a':2}}, 'ci-key-1')
              assert False, 'debió lanzar ValueError'
          except ValueError:
              print('✅ 409 Conflict OK')
          "
