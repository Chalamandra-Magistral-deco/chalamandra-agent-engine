name: Chalamandra Agent Engine CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-agents:
    name: Install and run the complete test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout canonical CatedralX source for tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Chalamandra-Magistral-deco/CatedralX
          ref: 73869c1a6b16dd42bed09ccc07a496538698dd27
          path: CatedralX
          token: ${{ secrets.CATEDRALX_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run every test (fail closed)
        env:
          CATEDRALX_PATH: ${{ github.workspace }}/CatedralX
        run: python -m pytest -q --ignore=CatedralX --junitxml=junit-agents.xml

      - name: Ruff lint gate
        run: python -m ruff check api adapters core dynamics pipeline registry telemetry tests

      - name: Mypy type-check gate
        run: python -m mypy api adapters core dynamics pipeline registry telemetry

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-agents-${{ github.run_id }}
          path: junit-agents.xml
          if-no-files-found: ignore
          retention-days: 14

  docker-build-and-smoke-test:
    name: Build and smoke-test the actual deployment image
    runs-on: ubuntu-latest
    needs: [test-agents]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout canonical CatedralX source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Chalamandra-Magistral-deco/CatedralX
          ref: 25df7705437ba3d997db4b8905933d9024fd5153
          path: CatedralX
          token: ${{ secrets.CATEDRALX_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Docker Compose configuration
        run: |
          cp config/.env.example config/.env
          cp config/.env.example config/worker.env
          docker compose config --quiet

      - name: Build pinned canonical CatedralX base image
        run: |
          CATEDRALX_REVISION="$(git -C CatedralX rev-parse HEAD)"
          docker build --pull --tag catedralx:v1.0-canonico \
            --build-arg CATEDRALX_REVISION="$CATEDRALX_REVISION" \
            --build-arg CATEDRALX_CODE_DIRTY=false \
            --file CatedralX/Dockerfile CatedralX

      - name: Build deployment image (fail closed)
        run: |
          AGENTS_REVISION="$(git rev-parse HEAD)"
          CATEDRALX_REVISION="$(git -C CatedralX rev-parse HEAD)"
          docker build --tag chalamandra-agents:ci \
            --build-arg AGENTS_REVISION="$AGENTS_REVISION" \
            --build-arg AGENTS_CODE_DIRTY=false \
            --build-arg CATEDRALX_REVISION="$CATEDRALX_REVISION" \
            --build-arg CATEDRALX_CODE_DIRTY=false \
            --file deploy/Dockerfile .

      - name: Build worker image (fail closed)
        run: |
          docker build --tag chalamandra-worker:ci \
            --build-arg AGENTS_BASE_IMAGE=chalamandra-agents:ci \
            --file deploy/Dockerfile.worker .

      - name: Verify image provenance labels
        shell: bash
        run: |
          set -euo pipefail
          agents_revision="$(git rev-parse HEAD)"
          catedralx_revision="$(git -C CatedralX rev-parse HEAD)"
          test "$(docker image inspect --format='{{index .Config.Labels "com.chalamandra.agents.revision"}}' chalamandra-agents:ci)" = "$agents_revision"
          test "$(docker image inspect --format='{{index .Config.Labels "com.chalamandra.agents.code.dirty"}}' chalamandra-agents:ci)" = "false"
          test "$(docker image inspect --format='{{index .Config.Labels "com.chalamandra.catedralx.revision"}}' chalamandra-agents:ci)" = "$catedralx_revision"
          test "$(docker image inspect --format='{{index .Config.Labels "com.chalamandra.catedralx.code.dirty"}}' chalamandra-agents:ci)" = "false"
          test "$(docker image inspect --format='{{index .Config.Labels "com.chalamandra.catedralx.revision"}}' catedralx:v1.0-canonico)" = "$catedralx_revision"
          test "$(docker image inspect --format='{{index .Config.Labels "com.chalamandra.catedralx.code.dirty"}}' catedralx:v1.0-canonico)" = "false"
          echo "Agents and embedded CatedralX image provenance verified."

      - name: Verify bundled CatedralX imports
        run: |
          docker run --rm --entrypoint python chalamandra-agents:ci -c 'import sys; sys.path.insert(0, "/app/CatedralX/elite"); import psutil; import cryptography; import REASON.razon; import FEX.GOVERNANCE.economic_cycle; from REASON.core_contract import evaluate_economic_opportunity; from AEX.DECISION import ordenes; print("CatedralX modules OK; psutil", psutil.__version__, "cryptography", cryptography.__version__)'

      - name: Start API and worker containers and verify both health checks
        shell: bash
        run: |
          set -euo pipefail
          # Disposable CI-only credentials; never reuse outside this isolated smoke test.
          integrity_key="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          jwt_secret="$(printf '%s-%s' 'synthetic-smoke-jwt' 'secret-32-bytes-ok')"
          service_secret="synthetic-smoke-service-jwt-secret"
          webhook_secret="synthetic-smoke-webhook-secret-32-bytes-min"
          verifier_id="isolated-docker-e2e-verifier"
          verifier_seed="$(printf '44%.0s' {1..32})"
          verifier_public_key="$(docker run --rm --entrypoint python --env TEST_SEED="$verifier_seed" chalamandra-agents:ci -c 'import os; from nacl.signing import SigningKey; print(SigningKey(bytes.fromhex(os.environ["TEST_SEED"])).verify_key.encode().hex())')"

          docker network create chalamandra-agents-ci
          docker volume create chalamandra-agents-ci-state

          docker run --detach --name chalamandra-agents-api-ci \
            --network chalamandra-agents-ci \
            --publish 127.0.0.1:8766:8766 \
            --volume chalamandra-agents-ci-state:/home/chalamandra/.local/state/chalamandra \
            --env CHALAMANDRA_CANDIDATE_HMAC_KEY="$integrity_key" \
            --env CHALAMANDRA_JWT_SECRET="$jwt_secret" \
            --env CHALAMANDRA_CATEDRALX_JWT_SECRET="$service_secret" \
            --env CHALAMANDRA_API_ENABLE_MODEL_CALLS=false \
            --env CHALAMANDRA_VERIFIER_ID="$verifier_id" \
            --env CHALAMANDRA_VERIFIER_PUBLIC_KEY="$verifier_public_key" \
            --env CHALAMANDRA_WEBHOOK_SECRET="$webhook_secret" \
            --env CHALAMANDRA_WEBHOOK_PRIVATE_HOST_ALLOWLIST=chalamandra-e2e-runner-ci \
            chalamandra-agents:ci

          docker run --detach --name chalamandra-agents-worker-ci \
            --network chalamandra-agents-ci \
            --volume chalamandra-agents-ci-state:/home/chalamandra/.local/state/chalamandra \
            --env CHALAMANDRA_CANDIDATE_HMAC_KEY="$integrity_key" \
            --env CHALAMANDRA_API_ENABLE_MODEL_CALLS=false \
            chalamandra-worker:ci

          for container in chalamandra-agents-api-ci chalamandra-agents-worker-ci; do
            healthy=false
            for ((attempt = 1; attempt <= 30; attempt++)); do
              status="$(docker inspect --format='{{.State.Health.Status}}' "$container")"
              if [[ "$status" == "healthy" ]]; then
                echo "$container health check passed."
                healthy=true
                break
              fi
              if [[ "$status" == "unhealthy" ]]; then
                docker logs "$container"
                exit 1
              fi
              sleep 2
            done
            if [[ "$healthy" != "true" ]]; then
              docker logs "$container"
              echo "$container did not become healthy within 60 seconds." >&2
              exit 1
            fi
          done

      - name: Run accepted and rejected business flows against Docker containers
        shell: bash
        run: |
          set -euo pipefail
          integrity_key="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          jwt_secret="$(printf '%s-%s' 'synthetic-smoke-jwt' 'secret-32-bytes-ok')"
          service_secret="synthetic-smoke-service-jwt-secret"
          webhook_secret="synthetic-smoke-webhook-secret-32-bytes-min"
          verifier_id="isolated-docker-e2e-verifier"
          verifier_seed="$(printf '44%.0s' {1..32})"

          docker run --rm --name chalamandra-e2e-runner-ci \
            --network chalamandra-agents-ci \
            --network-alias chalamandra-e2e-runner-ci \
            --volume chalamandra-agents-ci-state:/home/chalamandra/.local/state/chalamandra:ro \
            --volume "$GITHUB_WORKSPACE/verifier:/app/verifier:ro" \
            --env CHALAMANDRA_STATE_DIR=/home/chalamandra/.local/state/chalamandra \
            --env CHALAMANDRA_CANDIDATE_HMAC_KEY="$integrity_key" \
            --env CHALAMANDRA_JWT_SECRET="$jwt_secret" \
            --env CHALAMANDRA_CATEDRALX_JWT_SECRET="$service_secret" \
            --env CHALAMANDRA_WEBHOOK_SECRET="$webhook_secret" \
            --env CHALAMANDRA_VERIFIER_ID="$verifier_id" \
            --env CHALAMANDRA_ED25519_SEED="$verifier_seed" \
            --entrypoint python \
            chalamandra-agents:ci \
            /app/scripts/docker_business_e2e.py

      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs chalamandra-agents-api-ci || true
          docker logs chalamandra-agents-worker-ci || true

      - name: Remove smoke-test containers and shared state
        if: always()
        run: |
          docker rm --force chalamandra-e2e-runner-ci chalamandra-agents-api-ci chalamandra-agents-worker-ci || true
          docker volume rm chalamandra-agents-ci-state || true
          docker network rm chalamandra-agents-ci || true