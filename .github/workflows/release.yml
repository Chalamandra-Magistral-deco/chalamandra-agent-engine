name: Chalamandra Agent Engine CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-agents:
    name: Install and run the complete test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout canonical CatedralX source for tests
        uses: actions/checkout@v4
        with:
          repository: Chalamandra-Magistral-deco/CatedralX
          ref: c1a3d0334b9193417e5f614b68bb51011fdd887f
          path: CatedralX
          token: ${{ secrets.CATEDRALX_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run every test (fail closed)
        env:
          CATEDRALX_PATH: ${{ github.workspace }}/CatedralX
        run: python -m pytest -q --ignore=CatedralX --junitxml=junit-agents.xml

      - name: Ruff lint gate
        run: python -m ruff check api adapters core dynamics pipeline registry security telemetry tests

      - name: Mypy type-check gate
        run: python -m mypy api adapters core dynamics pipeline registry security telemetry

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-agents-${{ github.run_id }}
          path: junit-agents.xml
          if-no-files-found: ignore
          retention-days: 14

  security-gates:
    name: Semgrep and Trivy security gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep Python security scan
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --volume "${RUNNER_TEMP}:/reports" \
            --workdir /src \
            semgrep/semgrep:1.182.1 \
            semgrep scan --config p/python --metrics=off --error \
              --json --output /reports/semgrep-agents.json .

      - name: Trivy filesystem security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-agents-fs.json
          hide-progress: true
          timeout: 10m

      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-agents-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/semgrep-agents.json
            ${{ runner.temp }}/trivy-agents-fs.json
          if-no-files-found: ignore
          retention-days: 14

  docker-build-and-smoke-test:
    name: Build and smoke-test API and worker images
    runs-on: ubuntu-latest
    needs: [test-agents, security-gates]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout canonical CatedralX source
        uses: actions/checkout@v4
        with:
          repository: Chalamandra-Magistral-deco/CatedralX
          ref: c1a3d0334b9193417e5f614b68bb51011fdd887f
          path: CatedralX
          token: ${{ secrets.CATEDRALX_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned canonical CatedralX base image
        run: docker build --pull --tag catedralx:v1.0-canonico --file deploy/CatedralX.Dockerfile .

      - name: Build API deployment image (fail closed)
        run: docker build --tag chalamandra-agents:ci --file deploy/Dockerfile .

      - name: Build worker deployment image (fail closed)
        run: |
          docker build --tag chalamandra-agents-worker:ci \
            --build-arg AGENTS_BASE_IMAGE=chalamandra-agents:ci \
            --file deploy/Dockerfile.worker .

      - name: Verify worker runs as non-root
        shell: bash
        run: |
          worker_user="$(docker image inspect --format='{{.Config.User}}' chalamandra-agents-worker:ci)"
          if [[ "$worker_user" != "chalamandra" ]]; then
            echo "Expected worker user chalamandra, got: $worker_user" >&2
            exit 1
          fi

      - name: Verify bundled CatedralX imports
        run: |
          docker run --rm --entrypoint python chalamandra-agents:ci -c 'import sys; sys.path.insert(0, "/app/CatedralX/elite"); import psutil; import REASON.razon; print("CatedralX imports OK; psutil", psutil.__version__)'

      - name: Trivy API image vulnerability report (advisory baseline)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: chalamandra-agents:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: ${{ runner.temp }}/trivy-agents-api-image.json
          hide-progress: true
          timeout: 10m

      - name: Trivy worker image vulnerability report (advisory baseline)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: chalamandra-agents-worker:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: ${{ runner.temp }}/trivy-agents-worker-image.json
          hide-progress: true
          timeout: 10m

      - name: Preserve image security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-agents-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/trivy-agents-api-image.json
            ${{ runner.temp }}/trivy-agents-worker-image.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Start API container and verify its health check
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name chalamandra-agents-ci chalamandra-agents:ci
          for attempt in $(seq 1 30); do
            container_health="$(docker inspect --format='{{.State.Health.Status}}' chalamandra-agents-ci)"
            if [[ "$container_health" == "healthy" ]]; then
              echo "API container health check passed."
              exit 0
            fi
            if [[ "$container_health" == "unhealthy" ]]; then
              docker logs chalamandra-agents-ci
              exit 1
            fi
            sleep 2
          done
          docker logs chalamandra-agents-ci
          echo "Container did not become healthy within 60 seconds." >&2
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker logs chalamandra-agents-ci || true

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force chalamandra-agents-ci || true
