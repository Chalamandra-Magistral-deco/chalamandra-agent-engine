[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chalamandra-agents"
version = "0.1.0"
description = "Sistema de agentes multi-modelo"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "azure-identity>=1.19.0",
    "azure-keyvault-secrets>=4.9.0",
    # dynamics (sistemas dinámicos con retardo)
    "numpy>=2.5",
    "scipy>=1.18",
    "PyNaCl>=1.5,<2",
    "PyJWT>=2.8.0",
    "psutil>=5.9,<8",
    "openai>=1.0.0",
    "google-generativeai>=0.5.0",
    "ollama>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24,<2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24,<2", "ruff>=0.14", "mypy>=1.18"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["venv", ".venv", "*.egg-info", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true

[tool.setuptools.packages.find]
include = ["dynamics*", "adapters*", "pipeline*", "registry*", "telemetry*", "config*", "security*", "core*", "api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

