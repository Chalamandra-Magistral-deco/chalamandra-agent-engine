# Gitleaks allowlist — hallazgos generic-api-key en el HISTORIAL del repo.
# Ninguno es un secreto real:
# - config/.env.example:8 es el placeholder "replace-with-exactly-64-hex-characters".
# - tests/test_*.py son secretos sintéticos de pruebas (JWT / Idempotency-Key de test).
# - .github/workflows/release.yml (commits viejos) es la clave desechable de CI
#   ("aaaa...a", 64 caracteres) usada solo en el smoke-test.
# Se allowlistean los 12 commits del historial que contienen esos hallazgos
# (sus únicos hallazgos son los listados arriba). Los commits nuevos no se ven
# afectados: un secreto real en un commit futuro seguirá siendo detectado.
[extend]
useDefault = true

[allowlist]
commits = [
